<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Mod Menu Pro</title>
    <style>
        body {
            background-color: #0b0f19;
            color: #ffffff;
            font-family: Arial, sans-serif;
            margin: 0;
            padding: 10px;
            touch-action: pan-y; /* Chỉ cho phép cuộn dọc */
        }
        .header-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 15px;
        }
        .menu-btn {
            background: #1e293b;
            border: 1px solid #334155;
            color: #38bdf8;
            padding: 6px 10px;
            border-radius: 6px;
            cursor: pointer;
            font-size: 16px;
        }
        h2 {
            text-align: center;
            color: #38bdf8;
            margin: 0;
            font-size: 16px;
            text-transform: uppercase;
            flex-grow: 1;
        }
        
        /* Khung thanh tìm kiếm ẩn mặc định */
        .search-container {
            display: none;
            margin-bottom: 15px;
        }
        .search-input {
            width: 100%;
            padding: 10px 14px;
            background: #1e293b;
            border: 1px solid #334155;
            color: #ffffff;
            border-radius: 8px;
            font-size: 14px;
            box-sizing: border-box;
            outline: none;
        }
        .search-input:focus {
            border-color: #38bdf8;
        }

        #mod-list-container {
            max-height: 85vh;
            overflow-y: auto;
            padding-right: 4px;
        }
        #mod-list-container::-webkit-scrollbar {
            width: 5px;
        }
        #mod-list-container::-webkit-scrollbar-thumb {
            background: #334155;
            border-radius: 10px;
        }
        .mod-card {
            background: #1e293b;
            border-radius: 12px;
            padding: 12px;
            margin-bottom: 15px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.4);
            border: 1px solid #334155;
            position: relative;
        }
        .mod-card img {
            width: 100%;
            height: 160px;
            border-radius: 8px;
            object-fit: cover;
            background: #0f172a;
            border: 1px solid #475569;
            display: block;
            cursor: pointer;
            transition: 0.2s;
        }
        .mod-card img:active {
            opacity: 0.8;
            transform: scale(0.98);
        }
        /* Icon Trái tim góc trên bên phải ảnh */
        .favorite-icon {
            position: absolute;
            top: 20px;
            right: 20px;
            background: rgba(0, 0, 0, 0.6);
            border: 1px solid #475569;
            border-radius: 50%;
            width: 32px;
            height: 32px;
            display: flex;
            justify-content: center;
            align-items: center;
            cursor: pointer;
            font-size: 16px;
            color: #ffffff;
            transition: 0.2s;
            user-select: none;
        }
        .favorite-icon.active {
            color: #ec4899; /* Màu hồng khi được thích */
            border-color: #ec4899;
            background: rgba(236, 72, 153, 0.2);
        }

        .mod-footer {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-top: 10px;
            gap: 10px;
        }
        .mod-info h4 {
            margin: 0;
            font-size: 14px;
            color: #f8fafc;
            text-align: left;
        }
        .btn-group {
            display: flex;
            gap: 6px;
            flex-shrink: 0;
        }
        .btn {
            padding: 8px 12px;
            font-size: 12px;
            font-weight: bold;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            color: white;
            transition: 0.1s;
        }
        .btn-ffth { background: #2563eb; }
        .btn-ffmax { background: #ea580c; }
        .btn:active { transform: scale(0.95); opacity: 0.8; }

        /* Sidebar Drawer (Tab nhỏ cạnh trái) */
        .sidebar {
            position: fixed;
            top: 0;
            left: -250px;
            width: 220px;
            height: 100%;
            background: #0f172a;
            border-right: 1px solid #334155;
            z-index: 1000;
            transition: 0.3s ease-in-out;
            padding: 20px 10px;
            box-shadow: 5px 0 15px rgba(0,0,0,0.5);
            box-sizing: border-box;
        }
        .sidebar.open {
            left: 0;
        }
        .sidebar h3 {
            color: #38bdf8;
            font-size: 15px;
            margin-top: 0;
            border-bottom: 1px solid #334155;
            padding-bottom: 10px;
            text-align: center;
        }
        .sidebar-btn {
            display: block;
            width: 100%;
            background: #1e293b;
            color: #f8fafc;
            border: 1px solid #334155;
            padding: 10px;
            border-radius: 8px;
            text-align: left;
            font-size: 13px;
            font-weight: bold;
            margin-bottom: 10px;
            cursor: pointer;
            transition: 0.2s;
        }
        .sidebar-btn:active {
            background: #334155;
        }
        .overlay {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0,0,0,0.5);
            z-index: 995;
        }
        .overlay.show {
            display: block;
        }

        /* Modal thông báo */
        .modal {
            display: none;
            position: fixed;
            z-index: 1100;
            left: 0;
            top: 0;
            width: 100%;
            height: 100%;
            background-color: rgba(0, 0, 0, 0.75);
            justify-content: center;
            align-items: center;
        }
        .modal-content {
            background: #1e293b;
            padding: 20px;
            border-radius: 12px;
            width: 85%;
            max-width: 340px;
            border: 1px solid #38bdf8;
            text-align: center;
            box-shadow: 0 5px 20px rgba(0,0,0,0.6);
        }
        .modal-content h3 {
            color: #38bdf8;
            margin-top: 0;
            font-size: 16px;
        }
        .modal-desc {
            color: #cbd5e1;
            font-size: 13px;
            line-height: 1.5;
            background: #0f172a;
            padding: 12px;
            border-radius: 8px;
            text-align: left;
            max-height: 200px;
            overflow-y: auto;
            border: 1px solid #334155;
            white-space: pre-line;
        }
        .btn-close {
            background: #ef4444;
            color: white;
            border: none;
            padding: 8px 24px;
            font-weight: bold;
            border-radius: 6px;
            cursor: pointer;
            margin-top: 15px;
            font-size: 13px;
        }
        .btn-close:active { transform: scale(0.95); }
    </style>
</head>
<body>

    <div class="header-bar">
        <button class="menu-btn" onclick="toggleSidebar()">☰</button>
        <h2 id="pageTitle">🔥 MZ TOOL V3 - 500 SKIN 🔥</h2>
        <div style="width: 32px;"></div> <!-- Cân bằng header -->
    </div>
    
    <!-- Thanh tìm kiếm (Mặc định ẩn) -->
    <div class="search-container" id="searchContainer">
        <input type="text" id="searchInput" class="search-input" placeholder="🔍 Nhập tên mod cần tìm..." oninput="renderModMenu()">
    </div>

    <div id="mod-list-container"></div>

    <!-- Thanh Drawer Sidebar bên trái -->
    <div class="sidebar" id="mySidebar">
        <h3>Menu Tùy Chọn</h3>
        <button class="sidebar-btn" onclick="resetPageCache()">🔄 Reset Page (Xóa Cache)</button>
        <button class="sidebar-btn" onclick="showFavoritesOnly()">❤️ Yêu thích đã lưu</button>
        <button class="sidebar-btn" onclick="toggleSearchBox()">🔍 Tìm Kiếm Mod</button>
        <button class="sidebar-btn" onclick="showAllMods()" style="color: #38bdf8;">🏠 Xem Tất Cả Mod</button>
    </div>
    <div class="overlay" id="sidebarOverlay" onclick="toggleSidebar()"></div>

    <!-- Bảng Modal hiển thị mô tả -->
    <div id="modModal" class="modal" onclick="closeModal(event)">
        <div class="modal-content" onclick="event.stopPropagation()">
            <h3 id="modalTitle">Tiêu đề mod</h3>
            <div class="modal-desc" id="modalDesc">Nội dung mô tả...</div>
            <button class="btn-close" onclick="closeModalDirect()">Đóng</button>
        </div>
    </div>

    <script>
        // =========================================================================

        // 3. ffmax: link_zip
        // 4. anh: link_anh (hoặc ko)
        // 5. mota: nội dung mô tả (hoặc ko)
        // =========================================================================
        const rawModData = `

MOTA: Null 





        `;

        let parsedMods = [];
        let favorites = JSON.parse(localStorage.getItem('mz_favorites')) || [];
        let viewingFavoritesOnly = false;
        let searchActive = false;

        function parseModsText(text) {
            const blocks = text.trim().split(/\n\s*\n/);
            const list = [];
            blocks.forEach((block, index) => {
                const lines = block.trim().split('\n');
                if (lines.length >= 4) {
                    let name = lines[0].trim();
                    let ffth = lines[1].replace(/^(ffth:|ffth\s*:)/i, '').trim();
                    let ffmax = lines[2].replace(/^(ffmax:|ffmax\s*:)/i, '').trim();
                    let anh = lines[3].replace(/^(anh:|anh\s*:)/i, '').trim();
                    let mota = "Chưa có mô tả cho bản mod này.";
                    
                    if (lines.length >= 5) {
                        let line4 = lines[4].trim();
                        let cleanedMota = line4.replace(/^(mota:|mota\s*:)/i, '').trim();
                        if (cleanedMota && cleanedMota.toLowerCase() !== 'ko') {
                            mota = cleanedMota;
                        }
                    }
                    
                    if (anh.toLowerCase() === 'ko' || anh === '') {
                        anh = 'https://via.placeholder.com/600x200?text=Macara+Modz';
                    }
                    
                    list.push({ id: index, name, image: anh, linkFFTh: ffth, linkFFMax: ffmax, mota: mota });
                }
            });
            return list;
        }

        function renderModMenu() {
            const container = document.getElementById('mod-list-container');
            parsedMods = parseModsText(rawModData);
            
            let displayList = parsedMods;
            
            // Lọc theo yêu thích nếu đang ở chế độ yêu thích
            if (viewingFavoritesOnly) {
                displayList = displayList.filter(mod => favorites.includes(mod.id));
                document.getElementById('pageTitle').innerText = "❤️ MOD YÊU THÍCH ❤️";
            } else {
                document.getElementById('pageTitle').innerText = "🔥 MZ TOOL V3 - 500 SKIN 🔥";
            }

            // Lọc theo từ khóa tìm kiếm nếu đang bật thanh tìm kiếm
            if (searchActive) {
                const query = document.getElementById('searchInput').value.toLowerCase().trim();
                if (query !== "") {
                    displayList = displayList.filter(mod => mod.name.toLowerCase().includes(query) || mod.mota.toLowerCase().includes(query));
                }
            }

            if (displayList.length === 0) {
                container.innerHTML = `<p style="text-align:center; color:#94a3b8; margin-top:40px;">Không tìm thấy bản mod nào phù hợp!</p>`;
                return;
            }

            let htmlContent = '';
            displayList.forEach((mod, index) => {
                let isFav = favorites.includes(mod.id);
                let favClass = isFav ? 'favorite-icon active' : 'favorite-icon';
                
                htmlContent += `
                    <div class="mod-card">
                        <div class="${favClass}" onclick="toggleFavorite(${mod.id})">❤️</div>
                        <img src="${mod.image}" alt="Banner" onclick="showDesc(${mod.id})" onerror="this.src='https://via.placeholder.com/600x200?text=No+Image'">
                        <div class="mod-footer">
                            <div class="mod-info">
                                <h4>${index + 1}. ${mod.name}</h4>
                            </div>
                            <div class="btn-group">
                                <button class="btn btn-ffth" onclick="installMod('${mod.linkFFTh}')">FF Thường</button>
                                <button class="btn btn-ffmax" onclick="installMod('${mod.linkFFMax}')">FF Max</button>
                            </div>
                        </div>
                    </div>
                `;
            });

            container.innerHTML = htmlContent;
        }

        // Toggle Thả tim yêu thích
        function toggleFavorite(id) {
            const index = favorites.indexOf(id);
            if (index > -1) {
                favorites.splice(index, 1);
            } else {
                favorites.push(id);
            }
            localStorage.setItem('mz_favorites', JSON.stringify(favorites));
            renderModMenu();
        }

        // Đóng mở Sidebar Drawer từ cạnh trái
        function toggleSidebar() {
            document.getElementById('mySidebar').classList.toggle('open');
            document.getElementById('sidebarOverlay').classList.toggle('show');
        }

        // Bật/Tắt khung tìm kiếm từ Menu
        function toggleSearchBox() {
            toggleSidebar();
            const searchContainer = document.getElementById('searchContainer');
            searchActive = !searchActive;
            
            if (searchActive) {
                searchContainer.style.display = 'block';
                document.getElementById('searchInput').focus();
            } else {
                searchContainer.style.display = 'none';
                document.getElementById('searchInput').value = '';
                renderModMenu();
            }
        }

        // Nút 1: Reset Page (Xóa cache reload)
        function resetPageCache() {
            toggleSidebar();
            window.location.reload(true);
        }

        // Nút 2: Xem danh sách yêu thích
        function showFavoritesOnly() {
            viewingFavoritesOnly = true;
            searchActive = false;
            document.getElementById('searchContainer').style.display = 'none';
            document.getElementById('searchInput').value = '';
            toggleSidebar();
            renderModMenu();
        }

        // Xem tất cả mod
        function showAllMods() {
            viewingFavoritesOnly = false;
            searchActive = false;
            document.getElementById('searchContainer').style.display = 'none';
            document.getElementById('searchInput').value = '';
            toggleSidebar();
            renderModMenu();
        }

        // Hỗ trợ vuốt từ cạnh trái sang phải để mở menu
        let touchStartX = 0;
        window.addEventListener('touchstart', e => {
            touchStartX = e.changedTouches[0].screenX;
        });
        window.addEventListener('touchend', e => {
            let touchEndX = e.changedTouches[0].screenX;
            if (touchStartX < 40 && touchEndX - touchStartX > 70) {
                document.getElementById('mySidebar').classList.add('open');
                document.getElementById('sidebarOverlay').classList.add('show');
            }
        });

        // Mở bảng mô tả khi click vào ảnh
        function showDesc(id) {
            const mod = parsedMods.find(m => m.id === id);
            if (mod) {
                document.getElementById('modalTitle').innerText = mod.name;
                document.getElementById('modalDesc').innerText = mod.mota;
                document.getElementById('modModal').style.display = 'flex';
            }
        }

        function closeModal(event) {
            document.getElementById('modModal').style.display = 'none';
        }

        function closeModalDirect() {
            document.getElementById('modModal').style.display = 'none';
        }

        function installMod(url) {
            if (!url || url.trim() === '') {
                alert("Bản mod này chưa có link tải cho phiên bản này!");
                return;
            }
            if (window.AndroidBridge) {
                AndroidBridge.installModFromHtml(url);
            } else {
                alert("Lỗi: Không tìm thấy cầu nối Android Bridge!");
            }
        }

        renderModMenu();
    </script>

</body>
</html>
