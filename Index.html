<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Mod Menu Pro</title>
    <style>
        /* Tắt hoàn toàn hiệu ứng vệt xanh/xám khi chạm trên WebView */
        * {
            -webkit-tap-highlight-color: transparent;
            box-sizing: border-box;
        }

        html, body {
            height: 100%;
            margin: 0;
            padding: 0;
            background-color: #0b0f19;
            color: #ffffff;
            font-family: Arial, sans-serif;
            overflow: hidden; /* Cố định màn hình, ngăn body cuộn toàn trang */
        }

        /* Khung bao bọc toàn ứng dụng dạng Flexbox cố định màn hình */
        .app-container {
            display: flex;
            flex-direction: column;
            height: 100%;
            padding: 10px;
        }

        .header-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 10px;
            flex-shrink: 0; /* Không bị co lại */
        }
        .menu-btn {
            background: #1e293b;
            border: 1px solid #334155;
            color: #38bdf8;
            padding: 6px 10px;
            border-radius: 6px;
            cursor: pointer;
            font-size: 16px;
        }
        h2 {
            text-align: center;
            color: #38bdf8;
            margin: 0;
            font-size: 16px;
            text-transform: uppercase;
            flex-grow: 1;
        }
        
        /* Thanh nút lọc nhanh vuốt ngang (Cố định ở trên) */
        .filter-bar-container {
            margin-bottom: 10px;
            flex-shrink: 0;
            overflow: hidden;
        }
        .filter-scroll {
            display: flex;
            gap: 8px;
            overflow-x: auto;
            white-space: nowrap;
            padding: 4px 2px 6px 2px;
            -webkit-overflow-scrolling: touch;
            touch-action: pan-x; /* Chỉ cho phép vuốt ngang, chặn trôi dọc */
        }
        .filter-scroll::-webkit-scrollbar {
            height: 3px;
        }
        .filter-scroll::-webkit-scrollbar-thumb {
            background: #334155;
            border-radius: 10px;
        }
        .filter-chip {
            background: #1e293b;
            border: 1px solid #334155;
            color: #cbd5e1;
            padding: 8px 14px;
            border-radius: 20px;
            font-size: 13px;
            font-weight: bold;
            cursor: pointer;
            flex-shrink: 0;
            transition: 0.2s;
        }
        .filter-chip.active {
            background: #2563eb;
            color: #ffffff;
            border-color: #38bdf8;
        }
        .filter-chip:active {
            transform: scale(0.95);
        }

        /* Khung thanh tìm kiếm ẩn mặc định */
        .search-container {
            display: none;
            margin-bottom: 10px;
            flex-shrink: 0;
        }
        .search-input {
            width: 100%;
            padding: 10px 14px;
            background: #1e293b;
            border: 1px solid #334155;
            color: #ffffff;
            border-radius: 8px;
            font-size: 14px;
            outline: none;
        }
        .search-input:focus {
            border-color: #38bdf8;
        }

        /* Khu vực danh sách mod độc lập, chỉ cuộn dọc phần này */
        #mod-list-container {
            flex: 1;
            overflow-y: auto;
            padding-right: 4px;
            -webkit-overflow-scrolling: touch;
        }
        #mod-list-container::-webkit-scrollbar {
            width: 5px;
        }
        #mod-list-container::-webkit-scrollbar-thumb {
            background: #334155;
            border-radius: 10px;
        }
        .mod-card {
            background: #1e293b;
            border-radius: 12px;
            padding: 12px;
            margin-bottom: 15px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.4);
            border: 1px solid #334155;
            position: relative;
        }
        .mod-card img {
            width: 100%;
            height: 160px;
            border-radius: 8px;
            object-fit: cover;
            background: #0f172a;
            border: 1px solid #475569;
            display: block;
            cursor: pointer;
            transition: 0.2s;
        }
        .mod-card img:active {
            opacity: 0.8;
            transform: scale(0.98);
        }

        /* Icon Trái tim góc trên bên phải ảnh */
        .favorite-icon {
            position: absolute;
            top: 20px;
            right: 20px;
            background: rgba(0, 0, 0, 0.6);
            border: 1px solid #475569;
            border-radius: 50%;
            width: 32px;
            height: 32px;
            display: flex;
            justify-content: center;
            align-items: center;
            cursor: pointer;
            font-size: 16px;
            color: #ffffff;
            transition: 0.2s;
            user-select: none;
            z-index: 5;
        }
        .favorite-icon.active {
            color: #ec4899; /* Màu hồng khi được thích */
            border-color: #ec4899;
            background: rgba(236, 72, 153, 0.2);
        }

        /* STICKER NEW MỚI GÓC TRÊN BÊN TRÁI */
        .new-badge {
            position: absolute;
            top: 20px;
            left: 12px; /* Đã chuyển sang bên trái thành công */
            background: linear-gradient(135deg, #ef4444, #f97316);
            color: #ffffff;
            font-size: 11px;
            font-weight: 800;
            padding: 4px 10px;
            border-radius: 20px;
            box-shadow: 0 0 12px rgba(239, 68, 68, 0.8);
            border: 1px solid #fca5a5;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            z-index: 5;
            animation: pulseNew 1.2s infinite alternate;
            user-select: none;
        }

        @keyframes pulseNew {
            0% { transform: scale(1); box-shadow: 0 0 8px rgba(239, 68, 68, 0.6); }
            100% { transform: scale(1.08); box-shadow: 0 0 16px rgba(249, 115, 22, 0.9); }
        }

        .mod-footer {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-top: 10px;
            gap: 10px;
        }
        .mod-info h4 {
            margin: 0;
            font-size: 14px;
            color: #f8fafc;
            text-align: left;
        }
        .btn-group {
            display: flex;
            gap: 6px;
            flex-shrink: 0;
        }
        .btn {
            padding: 8px 12px;
            font-size: 12px;
            font-weight: bold;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            color: white;
            transition: 0.1s;
        }
        .btn-ffth { background: #2563eb; }
        .btn-ffmax { background: #ea580c; }
        .btn:active { transform: scale(0.95); opacity: 0.8; }

        /* Sidebar Drawer (Tab nhỏ cạnh trái) */
        .sidebar {
            position: fixed;
            top: 0;
            left: -250px;
            width: 230px;
            height: 100%;
            background: #0f172a;
            border-right: 1px solid #334155;
            z-index: 1000;
            transition: 0.3s ease-in-out;
            padding: 20px 10px;
            box-sizing: border-box;
            overflow-y: auto;
        }
        .sidebar.open {
            left: 0;
        }
        .sidebar h3 {
            color: #38bdf8;
            font-size: 15px;
            margin-top: 0;
            border-bottom: 1px solid #334155;
            padding-bottom: 10px;
            text-align: center;
        }
        .sidebar-btn {
            display: block;
            width: 100%;
            background: #1e293b;
            color: #f8fafc;
            border: 1px solid #334155;
            padding: 10px;
            border-radius: 8px;
            text-align: left;
            font-size: 13px;
            font-weight: bold;
            margin-bottom: 8px;
            cursor: pointer;
            transition: 0.2s;
        }
        .sidebar-btn:active {
            background: #334155;
        }
        .overlay {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0,0,0,0.5);
            z-index: 995;
        }
        .overlay.show {
            display: block;
        }

        /* Modal thông báo / Hộp thoại lựa chọn gỡ mod */
        .modal {
            display: none;
            position: fixed;
            z-index: 1100;
            left: 0;
            top: 0;
            width: 100%;
            height: 100%;
            background-color: rgba(0, 0, 0, 0.75);
            justify-content: center;
            align-items: center;
        }
        .modal-content {
            background: #1e293b;
            padding: 20px;
            border-radius: 12px;
            width: 85%;
            max-width: 340px;
            border: 1px solid #38bdf8;
            text-align: center;
            box-shadow: 0 5px 20px rgba(0,0,0,0.6);
        }
        .modal-content h3 {
            color: #38bdf8;
            margin-top: 0;
            font-size: 16px;
        }
        .modal-desc {
            color: #cbd5e1;
            font-size: 13px;
            line-height: 1.5;
            background: #0f172a;
            padding: 12px;
            border-radius: 8px;
            text-align: left;
            max-height: 200px;
            overflow-y: auto;
            border: 1px solid #334155;
            white-space: pre-line;
        }
        .btn-close {
            background: #ef4444;
            color: white;
            border: none;
            padding: 8px 24px;
            font-weight: bold;
            border-radius: 6px;
            cursor: pointer;
            margin-top: 15px;
            font-size: 13px;
        }
        .btn-close:active { transform: scale(0.95); }
        .modal-btn-group {
            display: flex;
            flex-direction: column;
            gap: 8px;
            margin-top: 15px;
        }
        .modal-action-btn {
            width: 100%;
            padding: 10px;
            font-weight: bold;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            color: white;
            font-size: 13px;
        }
        .btn-blue { background: #2563eb; }
        .btn-orange { background: #ea580c; }
        .btn-gray { background: #475569; }

        /* CUSTOM RGB TOAST */
        #customToastContainer {
            position: fixed;
            top: -120px;
            left: 50%;
            transform: translateX(-50%);
            z-index: 9999;
            width: 90%;
            max-width: 350px;
            transition: top 0.5s cubic-bezier(0.68, -0.55, 0.265, 1.55);
        }
        
        .rgb-toast-box {
            position: relative;
            background: #1e293b;
            border-radius: 12px;
            padding: 15px;
            text-align: center;
            box-shadow: 0 10px 25px rgba(0,0,0,0.8);
        }
        
        .rgb-toast-box::before {
            content: '';
            position: absolute;
            top: -2px; left: -2px; right: -2px; bottom: -2px;
            background: linear-gradient(45deg, #ff0000, #ff7300, #fffb00, #48ff00, #00ffd5, #002bff, #7a00ff, #ff00c8, #ff0000);
            background-size: 400%;
            z-index: -1;
            border-radius: 14px;
            animation: glowingRGB 10s linear infinite;
        }

        @keyframes glowingRGB {
            0% { background-position: 0 0; }
            50% { background-position: 400% 0; }
            100% { background-position: 0 0; }
        }

        .toast-title {
            color: #f8fafc;
            font-size: 13px;
            font-weight: bold;
            margin-bottom: 5px;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }
        
        .toast-percent {
            font-size: 24px;
            font-weight: bold;
            color: #38bdf8;
            text-shadow: 0 0 10px rgba(56, 189, 248, 0.5);
            margin: 5px 0;
            transition: color 0.3s;
        }

        .toast-progress-bg {
            width: 100%;
            height: 6px;
            background: #0f172a;
            border-radius: 10px;
            overflow: hidden;
            margin-top: 8px;
        }

        .toast-progress-bar {
            height: 100%;
            width: 0%;
            background: linear-gradient(90deg, #38bdf8, #2563eb);
            border-radius: 10px;
            transition: width 0.2s linear;
        }
    </style>
</head>

                <button class="filter-chip" onclick="setCategoryFilter('character', this)">👤 Mod Nhân Vật</button>
                <button class="filter-chip" onclick="setCategoryFilter('gun', this)">🔫 Mod Súng</button>
                <button class="filter-chip" onclick="setCategoryFilter('anime', this)">⚡ Mod Anime</button>
                <button class="filter-chip" onclick="setCategoryFilter('single', this)">🌈 Mod Lẻ</button>
                <button class="filter-chip" onclick="setCategoryFilter('other', this)">📦 Mod Khác</button>
            </div>
        </div>

        <!-- Thanh tìm kiếm -->
        <div class="search-container" id="searchContainer">
            <input type="text" id="searchInput" class="search-input" placeholder="🔍 Nhập tên mod cần tìm..." oninput="renderModMenu()">
        </div>

        <!-- Danh sách mod cuộn dọc -->
        <div id="mod-list-container"></div>

    <!-- Thanh Drawer Sidebar -->
    <div class="sidebar" id="mySidebar">
        <h3>Menu Tùy Chọn</h3>
        <button class="sidebar-btn" onclick="setCategoryFilter('all', null); toggleSidebar();" style="color: #38bdf8;">🏠 Xem Tất Cả Mod</button>

        <button class="sidebar-btn" onclick="setCategoryFilter('anime', null); toggleSidebar();">⚡ Tất Cả Mod Anime</button>
        <button class="sidebar-btn" onclick="setCategoryFilter('single', null); toggleSidebar();">🌈 Tất Cả Mod Lẻ</button>
        <button class="sidebar-btn" onclick="setCategoryFilter('other', null); toggleSidebar();">📦 Tất Cả Mod Khác</button>
        <button class="sidebar-btn" onclick="openRemoveModMenu()" style="color: #ef4444;">🗑️ Xóa Mod (Gốc)</button>
        <button class="sidebar-btn" onclick="toggleSearchBox()">🔍 Tìm Kiếm Mod</button>
        <button class="sidebar-btn" onclick="resetPageCache()">🔄 Reset Page (Xóa Cache)</button>
    </div>
    <div class="overlay" id="sidebarOverlay" onclick="toggleSidebar()"></div>

    <!-- Modal thông báo -->
    <div id="modModal" class="modal" onclick="closeModal(event)">
        <div class="modal-content" onclick="event.stopPropagation()">
            <h3 id="modalTitle">Tiêu đề mod</h3>
            <div id="modalBodyContent">
                <div class="modal-desc" id="modalDesc">Nội dung mô tả...</div>
                <button class="btn-close" onclick="closeModalDirect()">Đóng</button>
            </div>
        </div>
    </div>

    <!-- Toast Status -->
    <div id="customToastContainer">
        <div class="rgb-toast-box">
            <div class="toast-title" id="toastTitle">Đang tải: Mod Tên...</div>
            <div class="toast-percent" id="toastPercent">0%</div>
            <div class="toast-progress-bg">
                <div class="toast-progress-bar" id="toastProgressBar"></div>
            </div>
        </div>
    </div>

        ];
        const animeKeywords = [
            'nakroth', 'thứ nguyên vệ thần', 'madara', 'itachi', 'sasuke', 'naruto', 
            'goku', 'luffy', 'nika', 'kaito kid', 'megumi', 'minato', 'bluelock', 'blue lock', 
            'chidori', 'hỏa quyền', 'kakashi', 'tanjiro', 'zoro', 'saitama', 'nezuko', 'gojo', 'anime', 'pain', 'all might'
        ];
        const singleKeywords = ['mod lẻ'];

        // XỬ LÝ DỮ LIỆU CÓ HỖ TRỢ newmota: VÀ ẨN NÚT VỚI no / ko
        function parseModsText(text) {
            const blocks = text.trim().split(/\n\s*\n/);
            const list = [];
            blocks.forEach((block, index) => {
                const lines = block.trim().split('\n');
                if (lines.length >= 4) {
                    let name = lines[0].trim();
                    let ffth = lines[1].replace(/^(ffth:|ffth\s*:)/i, '').trim();
                    let ffmax = lines[2].replace(/^(ffmax:|ffmax\s*:)/i, '').trim();
                    let anh = lines[3].replace(/^(anh:|anh\s*:)/i, '').trim();
                    let mota = "Chưa có mô tả cho bản mod này.";
                    let isNew = false;
                    
                    if (lines.length >= 5) {
                        let line4 = lines[4].trim();
                        // Kiểm tra newmota:
                        if (/^newmota:/i.test(line4)) {
                            isNew = true;
                            let cleanedMota = line4.replace(/^newmota:/i, '').trim();
                            if (cleanedMota && cleanedMota.toLowerCase() !== 'ko' && cleanedMota.toLowerCase() !== 'no') {
                                mota = cleanedMota + " - 🔥";
                            }
                        } else if (/^mota:/i.test(line4)) {
                            let cleanedMota = line4.replace(/^mota:/i, '').trim();
                            if (cleanedMota && cleanedMota.toLowerCase() !== 'ko' && cleanedMota.toLowerCase() !== 'no') {
                                mota = cleanedMota + " - 🔥";
                            }
                        }
                    }
                    
                    if (anh.toLowerCase() === 'ko' || anh.toLowerCase() === 'no' || anh === '') {
                        anh = 'https://via.placeholder.com/600x200?text=Macara+Modz';
                    }
                    
                    list.push({ 
                        id: index, 
                        name: name, 
                        image: anh, 
                        linkFFTh: ffth, 
                        linkFFMax: ffmax, 
                        mota: mota, 
                        isNew: isNew 
                    });
                }
            });
            return list;
        }

        function matchesCategory(mod) {
            const contentText = (mod.name + " " + mod.mota).toLowerCase();
            
            const isCharacter = characterKeywords.some(keyword => contentText.includes(keyword));
            const isGun = gunKeywords.some(keyword => contentText.includes(keyword));
            const isAnime = animeKeywords.some(keyword => contentText.includes(keyword));
            const isSingle = singleKeywords.some(keyword => contentText.includes(keyword));

            if (currentCategory === 'all') return true;
            if (currentCategory === 'favorites') return favorites.includes(mod.id);
            if (currentCategory === 'character') return isCharacter;
            if (currentCategory === 'gun') return isGun;
            if (currentCategory === 'anime') return isAnime;
            if (currentCategory === 'single') return isSingle;
            if (currentCategory === 'other') return !isCharacter && !isGun && !isAnime && !isSingle;
            return true;
        }

        function renderModMenu() {
            const container = document.getElementById('mod-list-container');
            parsedMods = parseModsText(rawModData);
            
            let displayList = parsedMods.filter(mod => matchesCategory(mod));
            
            if (currentCategory === 'favorites') document.getElementById('pageTitle').innerText = "❤️ MOD YÊU THÍCH ❤️";
            else if (currentCategory === 'character') document.getElementById('pageTitle').innerText = "👤 MOD NHÂN VẬT 👤";
            else if (currentCategory === 'gun') document.getElementById('pageTitle').innerText = "🔫 MOD SÚNG 🔫";
            else if (currentCategory === 'anime') document.getElementById('pageTitle').innerText = "⚡ MOD ANIME ⚡";
            else if (currentCategory === 'single') document.getElementById('pageTitle').innerText = "🎭 MOD LẺ 🎭";
            else if (currentCategory === 'other') document.getElementById('pageTitle').innerText = "📦 MOD KHÁC 📦";

            if (searchActive) {
                const query = document.getElementById('searchInput').value.toLowerCase().trim();
                if (query !== "") {
                    displayList = displayList.filter(mod => mod.name.toLowerCase().includes(query) || mod.mota.toLowerCase().includes(query));
                }
            }

            if (displayList.length === 0) {
                container.innerHTML = `<p style="text-align:center; color:#94a3b8; margin-top:40px;">Không tìm thấy bản mod nào phù hợp!</p>`;
                return;

            let htmlContent = '';
            displayList.forEach((mod, index) => {
                let isFav = favorites.includes(mod.id);
                let favClass = isFav ? 'favorite-icon active' : 'favorite-icon';
                
                let safeName = mod.name.replace(/'/g, "\\'").replace(/"/g, "&quot;");

                let showFFTh = mod.linkFFTh && !['no', 'ko', 'null', ''].includes(mod.linkFFTh.toLowerCase().trim());
                let showFFMax = mod.linkFFMax && !['no', 'ko', 'null', ''].includes(mod.linkFFMax.toLowerCase().trim());

                let btnFFThHtml = showFFTh ? `<button class="btn btn-ffth" onclick="installMod('${mod.linkFFTh}', '${safeName}', 'FF Thường')">FF Thường</button>` : '';
                let btnFFMaxHtml = showFFMax ? `<button class="btn btn-ffmax" onclick="installMod('${mod.linkFFMax}', '${safeName}', 'FF Max')">FF Max</button>` : '';

                // STICKER NEW BÊN TRÁI
                let newBadgeHtml = mod.isNew ? `<div class="new-badge">NEW</div>` : '';

                htmlContent += `
                    <div class="mod-card">
                        ${newBadgeHtml}
                        <div class="${favClass}" onclick="toggleFavorite(${mod.id})">❤️</div>
                        <img src="${mod.image}" alt="Banner" onclick="showDesc(${mod.id})" onerror="this.src='https://via.placeholder.com/600x200?text=No+Image'">

                            <div class="btn-group">
                                ${btnFFThHtml}
                                ${btnFFMaxHtml}
                            </div>
                        </div>
                    </div>
                `;
            });

            container.innerHTML = htmlContent;
        }

                if (percent >= 100) {
                    percent = 100;
                    clearInterval(toastSimulationInterval);
                    
                    percentEl.innerText = `100%`;
                    percentEl.style.color = '#4ade80';
                    progressEl.style.width = `100%`;
                    progressEl.style.background = 'linear-gradient(90deg, #4ade80, #16a34a)';
                    titleEl.innerText = `✅ Đã cài đặt xong!`;

                    setTimeout(() => {
                        toastContainer.style.top = '-120px';
                    }, 2500);
                } else {
                    percentEl.innerText = `${percent}%`;
                    progressEl.style.width = `${percent}%`;
                }
            }, 300);
        }

        function installMod(url, modName, version) {
            if (!url || url.trim() === '' || url.toLowerCase() === 'no' || url.toLowerCase() === 'ko') {
                alert("Bản mod này chưa có link tải cho phiên bản này!");
                return;
            }
            
            showRGBToast(modName, version);

            if (window.AndroidBridge) {
                AndroidBridge.installModFromHtml(url);
            } else {
                console.log("Không tìm thấy Android Bridge! Link: " + url);
            }
        }

        renderModMenu();
    </script>
</body>
</html>
